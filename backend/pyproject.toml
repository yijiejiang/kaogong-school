[project]
name = "kaogong-school-backend"
version = "0.1.0"
description = "Personal civil service exam tutoring multi-agent backend"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.60.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "jieba>=0.42.1",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "yt-dlp>=2024.12.0",
    "ocrmac>=0.1.6; sys_platform == 'darwin'",
    "qrcode>=8.0",
    "faster-whisper>=1.2.1",
    "av>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
